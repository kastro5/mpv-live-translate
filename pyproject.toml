[project]
name = "mpv-live-translate"
version = "0.1.0"
description = "Live translated subtitles in mpv, generated just ahead of the playhead with ElevenLabs Scribe and Claude"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "elevenlabs>=2.71.0",
    "platformdirs>=4.3",
    "python-mpv-jsonipc>=1.4,<1.5",
]

[project.scripts]
live-translate = "live_translate.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_translate"]

[tool.hatch.build.targets.wheel.force-include]
"mpv/live-translate.lua" = "live_translate/live-translate.lua"

[tool.pytest.ini_options]
testpaths = ["tests"]
