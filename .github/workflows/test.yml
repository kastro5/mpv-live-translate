name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Package includes the mpv script
        run: |
          uv build --wheel
          uv run --no-project --with dist/*.whl python -c "from importlib import resources; assert (resources.files('live_translate') / 'live-translate.lua').is_file()"
        shell: bash
